services:
  db:
    image: mysql:8.0
    container_name: nexusmind_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-nexusmind}
      MYSQL_USER: ${DB_USER:-nexusmind}
      MYSQL_PASSWORD: ${DB_PASS:?Set DB_PASS before starting Docker Compose}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD before starting Docker Compose}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 5s
      timeout: 5s
      retries: 15
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: nexusmind_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "8080"
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: ${DB_USER:-nexusmind}
      DB_PASS: ${DB_PASS:?Set DB_PASS before starting Docker Compose}
      DB_NAME: ${DB_NAME:-nexusmind}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY before starting Docker Compose}
      APP_ENV: ${APP_ENV:-production}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:9000}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      XKIRO_API_KEY: ${XKIRO_API_KEY:-}
      XKIRO_API_BASE_URL: "https://api.xkiro.com/v1"
      XKIRO_MODEL: "deepseek/deepseek-v4-flash"
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:9000}
      BOOTSTRAP_DPA_USERNAME: ${BOOTSTRAP_DPA_USERNAME:-}
      BOOTSTRAP_DPA_PASSWORD: ${BOOTSTRAP_DPA_PASSWORD:-}
      BOOTSTRAP_DPA_PROGRAM_STUDI_ID: ${BOOTSTRAP_DPA_PROGRAM_STUDI_ID:-}
      BOOTSTRAP_KAPRODI_USERNAME: ${BOOTSTRAP_KAPRODI_USERNAME:-}
      BOOTSTRAP_KAPRODI_PASSWORD: ${BOOTSTRAP_KAPRODI_PASSWORD:-}
      BOOTSTRAP_KAPRODI_PROGRAM_STUDI_ID: ${BOOTSTRAP_KAPRODI_PROGRAM_STUDI_ID:-}
      BOOTSTRAP_STAFF_USERNAME: ${BOOTSTRAP_STAFF_USERNAME:-}
      BOOTSTRAP_STAFF_PASSWORD: ${BOOTSTRAP_STAFF_PASSWORD:-}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    expose:
      - "8080"

  frontend:
    build: ./frontend
    container_name: nexusmind_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:9000:80"

volumes:
  db_data:
